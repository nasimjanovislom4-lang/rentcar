<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RentCar - O'zbekistonda zamonaviy avtomobillarni ijaraga berish va avtoparkni boshqarish platformasi. Tezkor onlayn bron va serverless SQLite boshqaruvi.">
  <meta name="theme-color" content="#0a0e17">
  <title>RentCar – Avtomobillarni Ijaraga Berish Platformasi</title>

  <!-- Google Fonts & Stylesheets -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/client.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <!-- Global Navigation Bar -->
  <header class="navbar" id="app-navbar">
    <div class="brand-logo" id="brand-logo" style="cursor: pointer;">
      <div class="logo-icon">🚗</div>
      <div>Rent<span class="accent">Car</span></div>
    </div>

    <!-- Dynamic Nav Links -->
    <nav class="nav-links" id="main-nav-links">
      <!-- Injected by app.js based on active role -->
    </nav>

    <!-- Role Switcher & Action Controls -->
    <div style="display: flex; align-items: center; gap: 14px;">
      <!-- Language Pill -->
      <div style="font-size: 0.825rem; color: var(--text-muted); background: var(--bg-surface); padding: 4px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
        🇺🇿 UZ
      </div>

      <!-- Role Switcher -->
      <div class="role-badge-box" id="role-switcher-box" title="Foydalanuvchi rolini o'zgartirish">
        <button class="role-btn active" data-role="client" id="role-btn-client">👤 Mijoz</button>
        <button class="role-btn" data-role="manager" id="role-btn-manager">💼 Menejer</button>
        <button class="role-btn" data-role="admin" id="role-btn-admin">👑 Admin</button>
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="app-viewport">
    <div style="text-align: center; padding: 100px 20px;">
      <div style="font-size: 2.5rem; margin-bottom: 16px;">⏳</div>
      <h2>RentCar Platformasi Yuklanmoqda...</h2>
      <p style="color: var(--text-muted); margin-top: 8px;">SQLite WebAssembly bazasi va modullar initsializatsiya qilinmoqda.</p>
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Application Scripts -->
  <script src="js/vendor/sql-wasm.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/views/clientView.js"></script>
  <script src="js/views/dashboardView.js"></script>
  <script src="js/views/fleetView.js"></script>
  <script src="js/views/bookingsView.js"></script>
  <script src="js/views/crmView.js"></script>
  <script src="js/views/reportsView.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
